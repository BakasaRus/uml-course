<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Материалы недоступны</title>
  <style>
    :root {
      color-scheme: dark;
      --sl-color-bg: #0f172a;
      --sl-color-bg-nav: #111827;
      --sl-color-text: #e2e8f0;
      --sl-color-gray-3: #94a3b8;
      --sl-color-accent: #38bdf8;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { display: grid; min-block-size: 100vh; margin: 0; color: var(--sl-color-text); background: var(--sl-color-bg); place-items: center; }
    main { inline-size: min(100% - 3rem, 42rem); padding: clamp(2rem, 6vw, 4rem); border: 1px solid color-mix(in srgb, var(--sl-color-gray-3) 42%, transparent); border-radius: 1rem; background: var(--sl-color-bg-nav); box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 0.24); }
    main::before { display: block; inline-size: 2.5rem; block-size: 0.25rem; margin-block-end: 1.5rem; border-radius: 999px; background: var(--sl-color-accent); content: ""; }
    h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.25rem); font-weight: 650; letter-spacing: -0.025em; line-height: 1.2; }
  </style>
</head>
<body>
  <main>
    <h1>На время лекции материалы недоступны</h1>
  </main>
</body>
</html>
