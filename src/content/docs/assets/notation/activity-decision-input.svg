<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400" role="img" aria-labelledby="title desc">
  <title id="title">Дополнительный вход решения</title>
  <desc id="desc">Основной поток переносит Order. Дополнительный объектный поток переносит Boolean допуска. Решение передаёт Order по одному из двух выходов.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#334155" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="740" height="400" rx="12" fill="#FFFFFF"/>
  <g font-family="Arial, sans-serif" font-size="17" fill="#0F172A" stroke-linejoin="round" stroke-linecap="round">
    <text x="28" y="35" font-size="19" text-anchor="start" fill="#0F172A" font-weight="700"><tspan x="28" dy="0">Дополнительные данные выбирают путь основного токена</tspan></text>
    <rect x="25" y="125" width="195" height="60" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.8"/>
    <text x="122.5" y="160.78" font-size="17" text-anchor="middle" fill="#0F172A"><tspan x="122.5" dy="0">order: Order</tspan></text>
    <path d="M 340 125 L 370 155 L 340 185 L 310 155 Z" fill="#F8FAFC" stroke="#334155" stroke-width="1.8"/>
    <path d="M 220 155 H 310" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="525" y="65" width="190" height="66" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.8"/>
    <text x="620.0" y="103.78" font-size="17" text-anchor="middle" fill="#0F172A"><tspan x="620.0" dy="0">допущенные: Order</tspan></text>
    <rect x="525" y="220" width="190" height="66" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.8"/>
    <text x="620.0" y="258.78" font-size="17" text-anchor="middle" fill="#0F172A"><tspan x="620.0" dy="0">отклонённые: Order</tspan></text>
    <path d="M 340 125 V 98 H 525" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="435" y="80" font-size="16" text-anchor="middle" fill="#0F172A"><tspan x="435" dy="0">[допуск]</tspan></text>
    <path d="M 370 155 H 455 V 253 H 525" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="491" y="234" font-size="16" text-anchor="middle" fill="#0F172A"><tspan x="491" dy="0">[else]</tspan></text>
    <rect x="240" y="290" width="200" height="60" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.8"/>
    <text x="340.0" y="325.78" font-size="17" text-anchor="middle" fill="#0F172A"><tspan x="340.0" dy="0">допуск: Boolean</tspan></text>
    <path d="M 340 290 V 185" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="315" y="238" font-size="16" text-anchor="end" fill="#0F172A"><tspan x="315" dy="0">«decisionInputFlow»</tspan></text>
    <text x="370" y="378" font-size="16" text-anchor="middle" fill="#475569"><tspan x="370" dy="0">Оба выходных потока передают Order, а не Boolean.</tspan></text>
  </g>
</svg>
