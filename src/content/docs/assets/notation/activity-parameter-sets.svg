<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400" role="img" aria-labelledby="title desc">
  <title id="title">Альтернативные наборы параметров</title>
  <desc id="desc">Для вызова поиска клиента требуется либо customerId, либо одновременно email и verificationCode. Рамки охватывают контакты альтернативных наборов.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#334155" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="740" height="400" rx="12" fill="#FFFFFF"/>
  <g font-family="Arial, sans-serif" font-size="17" fill="#0F172A" stroke-linejoin="round" stroke-linecap="round">
    <text x="28" y="35" font-size="19" text-anchor="start" fill="#0F172A" font-weight="700"><tspan x="28" dy="0">ParameterSet: выбор группы входов</tspan></text>
    <rect x="330" y="68" width="280" height="255" rx="14" fill="#F8FAFC" stroke="#334155" stroke-width="1.8"/>
    <text x="470.0" y="201.28" font-size="17" text-anchor="middle" fill="#0F172A"><tspan x="470.0" dy="0">Найти клиента</tspan></text>
    <rect x="316" y="103" width="14" height="14" rx="0" fill="#FFFFFF" stroke="#334155" stroke-width="1.8"/>
    <path d="M 35 110 H 316" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="160" y="92" font-size="16" text-anchor="middle" fill="#0F172A"><tspan x="160" dy="0">customerId: String</tspan></text>
    <rect x="316" y="213" width="14" height="14" rx="0" fill="#FFFFFF" stroke="#334155" stroke-width="1.8"/>
    <path d="M 35 220 H 316" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="160" y="202" font-size="16" text-anchor="middle" fill="#0F172A"><tspan x="160" dy="0">email: String</tspan></text>
    <rect x="316" y="263" width="14" height="14" rx="0" fill="#FFFFFF" stroke="#334155" stroke-width="1.8"/>
    <path d="M 35 270 H 316" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="160" y="252" font-size="16" text-anchor="middle" fill="#0F172A"><tspan x="160" dy="0">verificationCode: String</tspan></text>
    <rect x="294" y="88" width="54" height="44" fill="none" stroke="#334155" stroke-width="1.5"/>
    <rect x="294" y="195" width="54" height="100" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="290" y="77" font-size="15" text-anchor="end" fill="#475569"><tspan x="290" dy="0">По идентификатору</tspan></text>
    <text x="290" y="182" font-size="15" text-anchor="end" fill="#475569"><tspan x="290" dy="0">По почте и коду</tspan></text>
    <text x="370" y="361" font-size="17" text-anchor="middle" fill="#0F172A"><tspan x="370" dy="0">customerId ИЛИ (email И verificationCode)</tspan></text>
    <text x="370" y="386" font-size="16" text-anchor="middle" fill="#475569"><tspan x="370" dy="0">Данные внутри выбранного набора нужны совместно.</tspan></text>
  </g>
</svg>
