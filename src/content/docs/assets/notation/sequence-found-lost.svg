<svg xmlns="http://www.w3.org/2000/svg" width="740" height="440" viewBox="0 0 740 440" role="img" aria-labelledby="title desc">
  <title id="title">Найденное и потерянное сообщения</title>
  <desc id="desc">Найденное сообщение начинается закрашенным кружком и имеет известное получение на линии жизни сервиса. Потерянное отправлено сервисом и оканчивается закрашенным кружком за его пределами.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#334155" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="740" height="440" rx="12" fill="#FFFFFF"/>
  <g font-family="Arial, sans-serif" font-size="17" fill="#0F172A" stroke-linejoin="round" stroke-linecap="round">
    <rect x="28" y="40" width="684" height="350" rx="0" fill="#FFFFFF" stroke="#334155" stroke-width="1.8"/>
    <path d="M 28 72 H 346 L 358 60 V 40" fill="none" stroke="#334155" stroke-width="1.8"/>
    <text x="40" y="63" font-size="16" text-anchor="start" fill="#0F172A"><tspan x="40" dy="0">sd Неизвестные концы сообщений</tspan></text>
    <rect x="270" y="105" width="200" height="55" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.8"/>
    <text x="370.0" y="138.28" font-size="17" text-anchor="middle" fill="#0F172A"><tspan x="370.0" dy="0">service: Payment</tspan></text>
    <path d="M 370 160 V 367" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 5"/>
    <circle cx="80" cy="215" r="6" fill="#334155" stroke="#334155" stroke-width="1.8"/>
    <path d="M 86 215 H 370" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="222" y="197" font-size="16" text-anchor="middle" fill="#0F172A"><tspan x="222" dy="0">платёжПодтверждён</tspan></text>
    <path d="M 370 310 H 654" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
    <circle cx="660" cy="310" r="6" fill="#334155" stroke="#334155" stroke-width="1.8"/>
    <text x="515" y="290" font-size="17" text-anchor="middle" fill="#0F172A"><tspan x="515" dy="0">уведомить()</tspan></text>
    <text x="370" y="424" font-size="16" text-anchor="middle" fill="#475569"><tspan x="370" dy="0">Неизвестный конец сообщения не означает сетевую потерю.</tspan></text>
  </g>
</svg>
