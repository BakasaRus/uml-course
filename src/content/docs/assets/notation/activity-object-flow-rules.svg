<svg xmlns="http://www.w3.org/2000/svg" width="740" height="495" viewBox="0 0 740 495" role="img" aria-labelledby="title desc">
  <title id="title">Выбор и преобразование на объектном потоке</title>
  <desc id="desc">На первом потоке поведение selection выбирает заказ с максимальным приоритетом, переопределяя FIFO буфера. На втором transformation передаёт сумму заказа в контакт Money.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#334155" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="740" height="495" rx="12" fill="#FFFFFF"/>
  <g font-family="Arial, sans-serif" font-size="17" fill="#0F172A" stroke-linejoin="round" stroke-linecap="round">
    <text x="28" y="35" font-size="19" text-anchor="start" fill="#0F172A" font-weight="700"><tspan x="28" dy="0">Выбор значения на конкретном потоке</tspan></text>
    <rect x="30" y="145" width="200" height="65" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.8"/>
    <text x="130.0" y="172.28" font-size="17" text-anchor="middle" fill="#0F172A"><tspan x="130.0" dy="0">«centralBuffer»</tspan><tspan x="130.0" dy="22">заказы: Order</tspan></text>
    <text x="130" y="236" font-size="16" text-anchor="middle" fill="#0F172A"><tspan x="130" dy="0">{ordering = FIFO}</tspan></text>
    <rect x="505" y="145" width="205" height="65" rx="14" fill="#F8FAFC" stroke="#334155" stroke-width="1.8"/>
    <text x="607.5" y="172.28" font-size="17" text-anchor="middle" fill="#0F172A"><tspan x="607.5" dy="0">Обработать</tspan><tspan x="607.5" dy="22">приоритетный заказ</tspan></text>
    <rect x="491" y="170" width="14" height="14" rx="0" fill="#FFFFFF" stroke="#334155" stroke-width="1.8"/>
    <path d="M 230 177 H 491" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M 260 60 H 458 L 470 72 V 135 H 260 Z M 458 60 V 72 H 470" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
    <text x="365.0" y="92.0" font-size="16" text-anchor="middle" fill="#0F172A"><tspan x="365.0" dy="0">«selection»</tspan><tspan x="365.0" dy="21">максимальный priority</tspan></text>
    <path d="M 365 135 V 177" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="5 4"/>
    <path d="M 28 254 H 712" fill="none" stroke="#CBD5E1"/>
    <text x="28" y="284" font-size="19" text-anchor="start" fill="#0F172A" font-weight="700"><tspan x="28" dy="0">Преобразование передаваемого значения</tspan></text>
    <rect x="30" y="385" width="200" height="65" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.8"/>
    <text x="130.0" y="423.28" font-size="17" text-anchor="middle" fill="#0F172A"><tspan x="130.0" dy="0">order: Order</tspan></text>
    <rect x="505" y="385" width="205" height="65" rx="14" fill="#F8FAFC" stroke="#334155" stroke-width="1.8"/>
    <text x="607.5" y="412.28" font-size="17" text-anchor="middle" fill="#0F172A"><tspan x="607.5" dy="0">Рассчитать</tspan><tspan x="607.5" dy="22">комиссию</tspan></text>
    <rect x="491" y="410" width="14" height="14" rx="0" fill="#FFFFFF" stroke="#334155" stroke-width="1.8"/>
    <path d="M 230 417 H 491" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M 260 308 H 458 L 470 320 V 373 H 260 Z M 458 308 V 320 H 470" fill="#FFFFFF" stroke="#334155" stroke-width="1.4"/>
    <text x="365.0" y="335.0" font-size="16" text-anchor="middle" fill="#0F172A"><tspan x="365.0" dy="0">«transformation»</tspan><tspan x="365.0" dy="21">order.total</tspan></text>
    <path d="M 365 373 V 417" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="607" y="365" font-size="16" text-anchor="middle" fill="#0F172A"><tspan x="607" dy="0">amount: Money</tspan></text>
    <text x="370" y="480" font-size="16" text-anchor="middle" fill="#475569"><tspan x="370" dy="0">Поведения на потоке не изменяют предметные объекты.</tspan></text>
  </g>
</svg>
