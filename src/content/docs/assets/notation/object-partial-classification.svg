<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330" role="img" aria-labelledby="title desc">
  <title id="title">Несколько классификаций и частичный снимок</title>
  <desc id="desc">Один экземпляр анна имеет классификаторы Студент и Преподаватель. Спецификация записи показывает только статус; отсутствие других слотов не означает отсутствие их значений.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#334155" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="740" height="330" rx="12" fill="#FFFFFF"/>
  <g font-family="Arial, sans-serif" font-size="17" fill="#0F172A" stroke-linejoin="round" stroke-linecap="round">
    <text x="28" y="35" font-size="19" text-anchor="start" fill="#0F172A" font-weight="700"><tspan x="28" dy="0">Один экземпляр и объём известных данных</tspan></text>
    <rect x="28" y="85" width="365" height="125" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.8"/>
    <text x="210.5" y="117" text-anchor="middle" font-size="17" text-decoration="underline">анна : Студент, Преподаватель</text>
    <path d="M 28 137 H 393" fill="none" stroke="#334155" stroke-width="1.8"/>
    <text x="210.5" y="180" font-size="17" text-anchor="middle" fill="#0F172A"><tspan x="210.5" dy="0">имя = &quot;Анна&quot;</tspan></text>
    <rect x="427" y="85" width="285" height="125" rx="0" fill="#F8FAFC" stroke="#334155" stroke-width="1.8"/>
    <text x="569.5" y="117" text-anchor="middle" font-size="17" text-decoration="underline">запись81 : Запись</text>
    <path d="M 427 137 H 712" fill="none" stroke="#334155" stroke-width="1.8"/>
    <text x="569.5" y="180" font-size="17" text-anchor="middle" fill="#0F172A"><tspan x="569.5" dy="0">статус = Подтверждена</tspan></text>
    <text x="210.5" y="250" font-size="16" text-anchor="middle" fill="#475569"><tspan x="210.5" dy="0">Один человек соответствует</tspan><tspan x="210.5" dy="21">двум классификаторам.</tspan></text>
    <text x="569.5" y="250" font-size="16" text-anchor="middle" fill="#475569"><tspan x="569.5" dy="0">Автор и дата в этом снимке</tspan><tspan x="569.5" dy="21">не показаны.</tspan></text>
    <text x="370" y="310" font-size="16" text-anchor="middle" fill="#475569"><tspan x="370" dy="0">Полноту слотов и связей нужно оговорить перед проверкой.</tspan></text>
  </g>
</svg>
